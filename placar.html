<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050b1a">
<title>COLAFOG – Placar</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { --fundo:#050b1a; --painel:#0d1830; --linha:#22314f; --texto:#f1f5f9; --fraco:#94a3b8; --ouro:#facc15; --prata:#cbd5e1; --bronze:#f59e0b; --dq:#f87171; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--fundo); color:var(--texto); font:18px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:14px 24px; border-bottom:2px solid var(--linha); }
  header h1 { margin:0; font-size:clamp(22px, 2.6vw, 40px); flex:1; letter-spacing:.5px; }
  header .hora { color:var(--fraco); font-size:clamp(14px,1.2vw,20px); text-align:right; }
  .ctrl { display:flex; gap:8px; }
  .ctrl button { background:var(--painel); color:var(--texto); border:1px solid var(--linha); border-radius:10px; padding:10px 14px; font-size:16px; cursor:pointer; }
  .ctrl button.sel { background:#1d4f9c; border-color:#1d4f9c; }
  main { display:grid; grid-template-columns:1fr 1fr; gap:22px; padding:20px 24px; }
  main.uma { grid-template-columns:1fr; max-width:1300px; margin:0 auto; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } }
  section { background:var(--painel); border:1px solid var(--linha); border-radius:18px; padding:18px 20px; min-width:0; }
  section h2 { margin:0 0 4px; font-size:clamp(22px,2.2vw,38px); }
  section .sub { color:var(--fraco); margin-bottom:14px; font-size:clamp(14px,1.1vw,18px); }
  .podio { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:16px; }
  .lugar { border-radius:14px; padding:14px; background:#0a1328; border:2px solid var(--linha); text-align:center; min-width:0; }
  .lugar .n { font-size:clamp(28px,3vw,54px); font-weight:800; }
  .lugar .eq { font-size:clamp(17px,1.6vw,28px); font-weight:700; overflow-wrap:anywhere; }
  .lugar .esc { color:var(--fraco); font-size:clamp(12px,1vw,16px); }
  .lugar .alc { font-size:clamp(24px,2.6vw,46px); font-weight:800; font-variant-numeric:tabular-nums; margin-top:6px; }
  .lugar.p1 { border-color:var(--ouro); } .lugar.p1 .n, .lugar.p1 .alc { color:var(--ouro); }
  .lugar.p2 { border-color:var(--prata); } .lugar.p2 .n, .lugar.p2 .alc { color:var(--prata); }
  .lugar.p3 { border-color:var(--bronze); } .lugar.p3 .n, .lugar.p3 .alc { color:var(--bronze); }
  table { width:100%; border-collapse:collapse; font-size:clamp(15px,1.35vw,24px); }
  th { text-align:left; color:var(--fraco); font-weight:600; font-size:.75em; padding:6px 8px; border-bottom:1px solid var(--linha); }
  td { padding:8px; border-bottom:1px solid var(--linha); }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  td.pos { font-weight:800; width:3.2em; }
  tr.top td { font-weight:700; }
  tr.cinza td { color:var(--fraco); }
  tr.dq td { color:var(--dq); }
  .empate { font-size:.7em; color:var(--ouro); }
  .vazio { color:var(--fraco); padding:20px 0; }
  .estado { position:fixed; right:16px; bottom:12px; font-size:14px; color:var(--fraco); }
  .estado.off { color:var(--dq); }
  @media print {
    :root { --fundo:#fff; --painel:#fff; --linha:#999; --texto:#000; --fraco:#444; --ouro:#000; --prata:#000; --bronze:#000; --dq:#a00; }
    .ctrl, .estado { display:none; } main { grid-template-columns:1fr; } section { break-inside:avoid; page-break-after:always; border:0; }
  }
</style>
</head>
<body>
<header>
  <h1 id="titulo">COLAFOG – Placar ao vivo</h1>
  <div class="ctrl">
    <button data-mod="ambas" class="sel">Ambas</button><button data-mod="N3">Nível 3</button><button data-mod="N4">Nível 4</button>
    <button id="btnCsv" title="Exportar resultado (CSV)">Exportar</button>
    <button id="btnImp" title="Imprimir / salvar PDF">Imprimir</button>
    <button id="btnTela" title="Tela cheia">⛶</button>
  </div>
  <div class="hora" id="hora"></div>
</header>
<main id="main"></main>
<div class="estado" id="estado"></div>
<script src="nucleo.js"></script>
<script src="regras.js"></script>
<script src="placar.js"></script>
</body>
</html>
